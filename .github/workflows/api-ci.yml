name: API CI

on:
  push:
    branches: [main, "safreita-page-parallel-ocr"]
  pull_request:
    branches: [main, "safreita-page-parallel-ocr"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run api:typecheck

      - name: Run API tests
        run: npm run api:test
